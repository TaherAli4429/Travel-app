databases:
  - name: wanderly-db
    databaseName: wanderly_db
    user: wanderly_user
    plan: free
    region: oregon

services:
  - type: web
    name: wanderly-api
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    region: oregon
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wanderly-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: APP_NAME
        value: Wanderly Travel API
      - key: API_V1_PREFIX
        value: /api/v1
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"
      - key: CORS_ORIGINS
        value: "*"
